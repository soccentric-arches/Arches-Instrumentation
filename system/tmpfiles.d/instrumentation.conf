# /run/instrumentation with correct ownership and modes (REQ §13).
D /run/instrumentation 0755 instr-istate instr -
d /run/instrumentation 0755 instr-istate instr -
# Spoke registration sockets are created 0660 by istate (instr:<daemon>).
# Ctrl sockets are created 0600 root-only by each daemon.
d /run/instrumentation 0755 instr-istate instr -
